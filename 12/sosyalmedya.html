<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeşilçam Patisserie - Video Menü</title>
    <style>
        /* Genel Stil Ayarları */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1c1d1d;
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .mobile-container {
            width: 100%;
            max-width: 500px;
            background-color: #222424;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            padding-bottom: 40px;
        }
        /* Butonlar Bölümü */
        .buttons-section {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .glass-btn {
            display: block;
            width: 100%;
            padding: 14px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            backdrop-filter: blur(5px);
            transition: background 0.3s;
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .primary-btn {
            background: linear-gradient(135deg, #c49a45 0%, #e5be65 50%, #b08532 100%);
            color: #1c1d1d;
            border: none;
        }
        .btn-row {
            display: flex;
            gap: 10px;
        }
        .btn-row .glass-btn {
            flex: 1;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- Butonlar ve Sosyal Medya -->
        <div class="buttons-section">
            <a href="restorant.html" class="glass-btn primary-btn">Menu (Menü)</a>
            
            <div class="btn-row">
                <a href="https://maps.google.com/?q=Van+der+Vennestraat+135B+2525+CC+Den+Haag" target="_blank" class="glass-btn">Route (Yol Tarifi)</a>
                <a href="yorum.html" target="_blank" class="glass-btn">Reviews (Yorumlar)</a>
            </div>

            <!-- Sosyal Medya Hesapları (Instagram & TikTok Yan Yana) -->
            <div class="btn-row">
                <a href="https://www.instagram.com/yesilcampatisserie?stkn=bXhqd2ZjZ3NhNnhz" target="_blank" class="glass-btn">Instagram</a>
                <a href="https://www.tiktok.com/@yesilcampatisserie?_r=1&_t=ZS-99ruf5YGwzc" target="_blank" class="glass-btn">TikTok</a>
            </div>

            <!-- Facebook Butonu -->
            <a href="https://www.facebook.com/share/1JVQVZNVMj/?mibextid=wwXIfr" target="_blank" class="glass-btn">Facebook</a>

            <a href="uygulama.html" class="glass-btn">App (Uygulama)</a>
        </div>
    </div>

</body>
</html>
