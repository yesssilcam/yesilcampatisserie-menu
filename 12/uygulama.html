<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeşilçam Patisserie - Uygulamayı Yükle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #fff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #d4af37;
        }

        p.desc {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Oluşturduğun harika rehber görseli */
        .guide-img {
            width: 100%;
            border-radius: 15px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 25px;
        }

        .back-btn {
            display: inline-block;
            padding: 12px 25px;
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid #d4af37;
            border-radius: 30px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Yeşilçam Patisserie Mobil Uygulama</h1>
        <p class="desc">Menüyü telefonunuza bir uygulama gibi eklemek için hazırladığımız kılavuzu inceleyebilirsiniz.</p>

        <!-- Hazırladığın görselin dosya adını buraya yazıyoruz (Örn: kilavuz.png veya görselin adı neyse) -->
        <img src="kılavuz.jpeg" alt="iPhone Uygulama Yükleme Kılavuzu" class="guide-img">

        <a href="videolumenu.html" class="back-btn">← Ana Sayfaya Dön</a>
    </div>
    

</body>
</html>
